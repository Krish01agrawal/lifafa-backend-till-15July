<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Debug Tool</title>
</head>
<body>
    <h1>WebSocket Debug Tool</h1>
    <div id="output"></div>
    <button onclick="testConnection()">Test WebSocket Connection</button>
    
    <script>
        function log(message) {
            const output = document.getElementById('output');
            output.innerHTML += '<p>' + new Date().toLocaleTimeString() + ': ' + message + '</p>';
        }
        
        function testConnection() {
            log('🔍 Starting WebSocket debug test...');
            
            // Detect environment
            const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const backendUrl = isLocal 
                ? 'localhost:8001'
                : 'ec2-13-127-58-101.ap-south-1.compute.amazonaws.com:8000';
            
            log(`Environment: ${isLocal ? 'Local' : 'Production'}`);
            log(`Backend URL: ${backendUrl}`);
            
            // Test HTTP endpoint first
            log('🌐 Testing HTTP endpoint...');
            fetch(`http://${backendUrl}/health`)
                .then(response => response.json())
                .then(data => {
                    log('✅ HTTP endpoint working: ' + JSON.stringify(data));
                    testWebSocket(backendUrl);
                })
                .catch(error => {
                    log('❌ HTTP endpoint failed: ' + error.message);
                    log('⚠️ Backend might not be running or accessible');
                });
        }
        
        function testWebSocket(backendUrl) {
            log('🔌 Testing WebSocket connection...');
            
            const wsUrl = `ws://${backendUrl}/ws/chat/debug-test`;
            log(`WebSocket URL: ${wsUrl}`);
            
            const ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                log('✅ WebSocket connected successfully!');
                
                // Send test auth message
                const authMessage = {
                    jwt_token: "test_token_for_debug"
                };
                
                log('📤 Sending test authentication...');
                ws.send(JSON.stringify(authMessage));
            };
            
            ws.onmessage = (event) => {
                log('📨 Received message: ' + event.data);
            };
            
            ws.onerror = (error) => {
                log('❌ WebSocket error: ' + error);
                log('🔍 Check EC2 Security Group settings');
                log('🔍 Check if backend is running on port 8000');
            };
            
            ws.onclose = (event) => {
                log(`🔌 WebSocket closed. Code: ${event.code}, Reason: ${event.reason}`);
            };
            
            // Close connection after 10 seconds
            setTimeout(() => {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.close();
                    log('🕐 Test completed - connection closed');
                }
            }, 10000);
        }
    </script>
</body>
</html>
